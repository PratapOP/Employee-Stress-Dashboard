<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Stress Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="page fade-in">

    <!-- Header -->
    <header class="header">
        <h1>Employee Stress Analytics</h1>
        <p>ML-driven insights for workplace wellness</p>
    </header>

    <!-- Input Section -->
    <section class="card reveal">
        <h2>Daily Routine Overview</h2>

        <div class="form-grid">

            <!-- Sleep Hours -->
            <div class="form-group">
                <label for="sleep_hours">Sleep Hours</label>
                <input
                    type="number"
                    id="sleep_hours"
                    min="4"
                    max="9"
                    step="0.5"
                    value="7"
                >
            </div>

            <!-- Work Hours -->
            <div class="form-group">
                <label for="work_hours">Work Hours</label>
                <input
                    type="number"
                    id="work_hours"
                    min="6"
                    max="14"
                    step="1"
                    value="8"
                >
            </div>

            <!-- Screen Time -->
            <div class="form-group">
                <label for="screen_time">Screen Time</label>
                <select id="screen_time">
                    <option value="3">Low (0–3 hrs)</option>
                    <option value="6" selected>Moderate (4–6 hrs)</option>
                    <option value="9">High (7+ hrs)</option>
                </select>
            </div>

            <!-- Physical Activity -->
            <div class="form-group">
                <label for="physical_activity">Physical Activity</label>
                <select id="physical_activity">
                    <option value="0">None</option>
                    <option value="1" selected>Light (≤30 min)</option>
                    <option value="2">Moderate (30–60 min)</option>
                    <option value="3">Intense (1+ hr)</option>
                </select>
            </div>

            <!-- Social Interaction -->
            <div class="form-group">
                <label for="social_interaction">Social Interaction</label>
                <select id="social_interaction">
                    <option value="0">Very Low</option>
                    <option value="1">Low</option>
                    <option value="2" selected>Moderate</option>
                    <option value="3">High</option>
                </select>
            </div>

            <!-- Caffeine Intake -->
            <div class="form-group">
                <label for="caffeine_intake">Caffeine Intake (cups)</label>
                <input
                    type="number"
                    id="caffeine_intake"
                    min="0"
                    max="6"
                    step="1"
                    value="2"
                >
            </div>

        </div>

        <button class="primary-btn" onclick="predictStress()">
            Analyze Stress Level
        </button>
    </section>

    <!-- Results -->
    <section id="result" class="result hidden reveal"></section>
    <!-- Stress History -->
<section class="card reveal">
    <h2>Stress History</h2>

    <div class="table-wrapper">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Stress Level</th>
                    <th>Confidence</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                <tr>
                    <td colspan="3" class="empty-state">
                        No history available yet.
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/export/csv" class="secondary-btn">
            Download Stress Report (CSV)
        </a>
    </div>
</section>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
